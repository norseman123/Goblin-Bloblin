<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin Goblin Goblin</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #eeeeee;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { margin: 0 0 10px 0; color: #4ade80; }
        #game-container { position: relative; }
        canvas {
            background-color: #2a2a2a;
            border: 4px solid #4ade80;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.2);
        }
        #ui {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            width: 800px;
            justify-content: space-between;
        }
        .panel {
            background: #333;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #555;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .highlight { color: #facc15; }
        #instructions { margin-top: 15px; text-align: center; color: #aaa; }
    </style>
</head>
<body>

    <h1>🏭 Tuff Goblin Factory</h1>
    
    <div id="ui">
        <div class="panel">Shift (Day): <span id="dayNum" class="highlight">1</span></div>
        <div class="panel">Time Left: <span id="timer" class="highlight">30</span>s</div>
        <div class="panel">Quota: <span id="quotaText">0 / 2</span> Metal</div>
        <div class="panel">Carrying: <span id="inventory" class="highlight">Nothing</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div id="instructions">
        <strong>WASD / Arrows</strong> to Move | <strong>SPACEBAR</strong> to Interact near objects.<br>
        <em>Mine Iron -> Put in Furnace -> Wait -> Take Metal -> Sell Box</em>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        let day = 1;
        let timeLeft = 30;
        let quota = 2;
        let currentMetal = 0;
        let gameOver = false;
        let lastTime = Date.now();
        let frameTimer = 0;

        // Player (The Tuff Goblin)
        const player = {
            x: 400, y: 250, radius: 15, speed: 200, // Pixels per second
            color: '#4ade80', inventory: null
        };

        // Inputs
        const keys = { w: false, a: false, s: false, d: false, space: false };
        window.addEventListener('keydown', e => {
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            if(e.key === ' ') { e.preventDefault(); interact(); }
        });
        window.addEventListener('keyup', e => {
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        // Factory Stations
        const stations = [
            { id: 'mine', x: 100, y: 100, width: 60, height: 60, color: '#9ca3af', label: 'Iron Mine', has: 'Iron Ore' },
            { id: 'furnace', x: 400, y: 100, width: 70, height: 70, color: '#f97316', label: 'Furnace', processing: false, progress: 0, holds: null },
            { id: 'sell', x: 700, y: 400, width: 60, height: 60, color: '#eab308', label: 'Sell Box' }
        ];

        function interact() {
            if (gameOver) { resetGame(); return; }

            // Find closest station
            for (let s of stations) {
                let dx = player.x - (s.x + s.width/2);
                let dy = player.y - (s.y + s.height/2);
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 70) { // Interaction range
                    if (s.id === 'mine' && !player.inventory) {
                        player.inventory = 'Iron Ore';
                    }
                    else if (s.id === 'furnace') {
                        // Deposit Iron
                        if (player.inventory === 'Iron Ore' && !s.processing && !s.holds) {
                            player.inventory = null;
                            s.processing = true;
                            s.progress = 0;
                        }
                        // Retrieve Metal
                        else if (!player.inventory && s.holds === 'Metal') {
                            player.inventory = 'Metal';
                            s.holds = null;
                        }
                    }
                    else if (s.id === 'sell' && player.inventory === 'Metal') {
                        player.inventory = null;
                        currentMetal++;
                        if (currentMetal >= quota) winDay();
                    }
                    updateUI();
                    break;
                }
            }
        }

        function winDay() {
            day++;
            quota += 2;
            currentMetal = 0;
            timeLeft = 30;
            player.speed += 20; // Goblin gets "tuffer" and faster
            player.x = 400; player.y = 250;
            player.inventory = null;
            stations[1].processing = false;
            stations[1].holds = null;
            updateUI();
        }

        function resetGame() {
            day = 1; quota = 2; currentMetal = 0; timeLeft = 30;
            player.speed = 200; player.x = 400; player.y = 250;
            player.inventory = null;
            stations[1].processing = false; stations[1].holds = null;
            gameOver = false;
            lastTime = Date.now();
            gameLoop();
        }

        function updateUI() {
            document.getElementById('dayNum').innerText = day;
            document.getElementById('timer').innerText = Math.ceil(timeLeft);
            document.getElementById('quotaText').innerText = `${currentMetal} / ${quota}`;
            document.getElementById('inventory').innerText = player.inventory || 'Nothing';
        }

        function update(dt) {
            if (gameOver) return;

            // Movement
            if (keys.w) player.y -= player.speed * dt;
            if (keys.s) player.y += player.speed * dt;
            if (keys.a) player.x -= player.speed * dt;
            if (keys.d) player.x += player.speed * dt;

            // Bounds
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Furnace Logic
            let furnace = stations[1];
            if (furnace.processing) {
                furnace.progress += dt;
                if (furnace.progress >= 2) { // Takes 2 seconds to smelt
                    furnace.processing = false;
                    furnace.holds = 'Metal';
                }
            }

            // Timer
            timeLeft -= dt;
            if (timeLeft <= 0) {
                gameOver = true;
            }
            updateUI();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stations
            ctx.textAlign = "center";
            ctx.font = "14px Courier New";
            for (let s of stations) {
                ctx.fillStyle = s.color;
                ctx.fillRect(s.x, s.y, s.width, s.height);
                
                ctx.fillStyle = '#fff';
                ctx.fillText(s.label, s.x + s.width/2, s.y - 10);

                // Furnace UI
                if (s.id === 'furnace') {
                    if (s.processing) {
                        ctx.fillStyle = '#ef4444';
                        ctx.fillRect(s.x, s.y + s.height + 5, s.width * (s.progress/2), 5);
                    } else if (s.holds === 'Metal') {
                        ctx.fillStyle = '#fff';
                        ctx.fillText("READY", s.x + s.width/2, s.y + s.height + 15);
                    }
                }
            }

            // Draw Player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.closePath();
            ctx.fillStyle = '#fff';
            ctx.fillText("Goblin", player.x, player.y - 20);

            // Game Over Overlay
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ef4444';
                ctx.font = "40px Courier New";
                ctx.fillText("SHIFT FAILED. YOU ARE FIRED.", canvas.width/2, canvas.height/2);
                ctx.fillStyle = '#fff';
                ctx.font = "20px Courier New";
                ctx.fillText("Press SPACE to re-apply for your job.", canvas.width/2, canvas.height/2 + 40);
            }
        }

        function gameLoop() {
            const now = Date.now();
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            update(dt);
            draw();

            if (!gameOver) {
                requestAnimationFrame(gameLoop);
            } else {
                draw(); // Draw final game over frame
            }
        }

        // Start
        updateUI();
        gameLoop();
    </script>
</body>
</html>
