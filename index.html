<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin Factory Prototype</title>
    <style>
        body { 
            margin: 0; 
            background-color: #222; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: white; 
            font-family: sans-serif; 
            flex-direction: column;
        }
        canvas { 
            background-color: #87CEEB; /* Sky blue background */
            border: 4px solid #444; 
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }
        #instructions { 
            margin-bottom: 15px; 
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="instructions">WASD or Arrows to Move | SPACE or Click to Place Furnace</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- Game Settings ---
        const TILE_SIZE = 64;
        const SPEED = 250; // Goblin speed in pixels per second

        let lastTime = 0;
        const keys = {};
        const gridData = {}; // Stores buildings as "x,y": "furnace"

        // --- The Goblin ---
        const player = {
            x: 400,
            y: 300,
            width: 32,
            height: 32,
            color: '#32CD32' // Goblin Green
        };

        // --- Input Handling ---
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Click to build
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            placeBuilding(mouseX, mouseY);
        });

        // Spacebar to build
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                // Place it at the center of the goblin
                placeBuilding(player.x + player.width/2, player.y + player.height/2);
            }
        });

        // --- Core Logic ---
        function placeBuilding(x, y) {
            // Calculate grid coordinates
            const gridX = Math.floor(x / TILE_SIZE);
            const gridY = Math.floor(y / TILE_SIZE);
            const key = `${gridX},${gridY}`;

            // Only place if the spot is empty
            if (!gridData[key]) {
                gridData[key] = 'furnace';
                console.log(`Placed furnace at ${gridX}, ${gridY}`);
            }
        }

        function update(dt) {
            let dx = 0;
            let dy = 0;

            if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

            // Normalize diagonal movement so you don't move faster diagonally
            if (dx !== 0 && dy !== 0) {
                const length = Math.sqrt(dx * dx + dy * dy);
                dx /= length;
                dy /= length;
            }

            player.x += dx * SPEED * dt;
            player.y += dy * SPEED * dt;

            // Keep goblin inside the canvas boundaries
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
        }

        function draw() {
            // Clear the screen every frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw a faint grid to help visualize snapping
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            for (let x = 0; x < canvas.width; x += TILE_SIZE) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += TILE_SIZE) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 2. Draw Buildings
            for (const key in gridData) {
                const [gridX, gridY] = key.split(',').map(Number);
                
                // Draw a dark red block for the furnace
                ctx.fillStyle = '#8B0000'; 
                ctx.fillRect(gridX * TILE_SIZE, gridY * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                
                // Draw a little orange "fire" square inside the furnace
                ctx.fillStyle = '#FFA500'; 
                ctx.fillRect(gridX * TILE_SIZE + 16, gridY * TILE_SIZE + 32, 32, 16);
            }

            // 3. Draw the Goblin
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        // --- Game Loop ---
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000; // Convert to seconds
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop); // Call the loop again
        }

        // Start the game
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
