<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin Factory - 2.5D Isometric</title>
    <style>
        body { 
            margin: 0; background-color: #0b1320; display: flex; 
            justify-content: center; align-items: center; 
            height: 100vh; color: white; font-family: monospace; 
            overflow: hidden; user-select: none;
        }
        #game-container { position: relative; }
        canvas { 
            background-color: #2b4c65; 
            border: 4px solid #444; 
            box-shadow: 0px 0px 40px rgba(0,0,0,0.8);
            display: block;
        }
        #ui-layer {
            position: absolute; top: 10px; left: 10px;
            pointer-events: none; background: rgba(0, 0, 0, 0.85);
            padding: 15px; border-radius: 5px; border: 1px solid #777;
        }
        #game-over {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(200, 0, 0, 0.9); padding: 40px;
            border: 4px solid white; text-align: center;
            display: none; font-size: 24px; font-weight: bold; z-index: 10;
        }
        .ui-text { margin: 5px 0; font-size: 16px; font-weight: bold; }
        .controls { color: #aaa; font-size: 12px; margin-top: 10px; }
        
        /* Danger color classes for JS to toggle */
        .safe { color: #32CD32; }
        .warning { color: #FFA500; }
        .danger { color: #FF4500; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div class="ui-text" id="ui-scrap" style="color: #FFD700;">Scrap: 50</div>
            <div class="ui-text" id="ui-power" style="color: #00FFFF;">Power: 0 / 0</div>
            <hr style="border-color: #444;">
            <div class="ui-text safe" id="ui-pitch">Pitch (Y): 0°</div>
            <div class="ui-text safe" id="ui-roll">Roll (X): 0°</div>
            <hr style="border-color: #444;">
            <div class="ui-text" id="ui-selected" style="color: #fff;">Selected: Pearl Wood Floor</div>
            <div class="controls">
                1: Wood Floor | 2: Scrap Floor | 3: Steel Floor<br>
                4: Auto-Miner | 5: Furnace
            </div>
        </div>
        
        <div id="game-over">
            PLATFORM CAPSIZED!<br><br>
            <span style="font-size: 16px;">Refresh to fall again.</span>
        </div>

        <canvas id="gameCanvas" width="900" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- Isometric Engine Settings ---
        const TILE_W = 64;  // Width of the isometric diamond
        const TILE_H = 32;  // Height of the isometric diamond
        const SPEED = 4;    // Goblin movement speed

        const GRAVITY_FACTOR = 0.8;
        const MAX_ANGLE = 45; // Max degrees before flipping

        let lastTime = 0;
        const keys = {};
        let isGameOver = false;

        // Physics State (Dual Axis)
        let pitch = 0; // Tilt forward/backward
        let roll = 0;  // Tilt left/right
        let pitchVel = 0;
        let rollVel = 0;

        // --- Economy & Map ---
        let scrap = 70;
        let powerGen = 0;
        let powerUse = 0;
        const gridData = {}; // Key: "x,y"

        let mouseGridX = 0;
        let mouseGridY = 0;
        let selectedBuilding = 'floor_wood';

        // --- Entities ---
        // Player moves in grid coordinates (floats) for smooth 2.5D movement
        const player = { x: 0, y: 0, colorTop: '#32CD32', colorLeft: '#228B22', colorRight: '#006400', mass: 15 };

        // Debris rushing up from below
        const debrisParticles = Array.from({length: 40}, () => spawnDebris());

        function spawnDebris() {
            return {
                x: (Math.random() - 0.5) * canvas.width * 2,
                y: (Math.random() - 0.5) * canvas.height * 2,
                z: -500 - Math.random() * 500, // Starts deep below
                speed: 300 + Math.random() * 400,
                size: 10 + Math.random() * 30
            };
        }

        // --- Building Database (Now with 3D colors and Z-Heights) ---
        const BUILDINGS = {
            'core': { name: 'Core Stone', top: '#8A2BE2', left: '#4B0082', right: '#483D8B', mass: 100, isFloor: true, height: 16, cost: 0, pCost: 0, pGen: 0 },
            
            // Floors (height 8)
            'floor_wood': { name: 'Pearl Wood Floor', top: '#DEB887', left: '#A0522D', right: '#8B4513', mass: 2, isFloor: true, height: 8, cost: 5, pCost: 0, pGen: 0 },
            'floor_scrap': { name: 'Scrap Iron Floor', top: '#909090', left: '#606060', right: '#404040', mass: 10, isFloor: true, height: 8, cost: 15, pCost: 0, pGen: 0 },
            'floor_steel': { name: 'Dark Steel Floor', top: '#4F6F6F', left: '#2F4F4F', right: '#1F3F3F', mass: 40, isFloor: true, height: 8, cost: 40, pCost: 0, pGen: 0 },
            
            // Machines (built on top of floors, height 32)
            'miner': { name: 'Auto-Miner', top: '#5CA2D4', left: '#4682B4', right: '#27408B', mass: 8, isFloor: false, height: 32, cost: 25, pCost: 1, pGen: 0 },
            'furnace': { name: 'Furnace', top: '#B22222', left: '#8B0000', right: '#660000', mass: 15, isFloor: false, height: 32, cost: 15, pCost: 0, pGen: 5 }
        };

        gridData["0,0"] = { type: 'core', timer: 0, floorType: 'core' }; // Starting block

        // --- Input Handling ---
        window.addEventListener('keydown', e => {
            if (isGameOver) return;
            keys[e.code] = true;
            if (e.code === 'Digit1') selectedBuilding = 'floor_wood';
            if (e.code === 'Digit2') selectedBuilding = 'floor_scrap';
            if (e.code === 'Digit3') selectedBuilding = 'floor_steel';
            if (e.code === 'Digit4') selectedBuilding = 'miner';
            if (e.code === 'Digit5') selectedBuilding = 'furnace';
            if (e.code === 'Space') attemptBuild();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Convert mouse screen coordinates to isometric grid coordinates
        canvas.addEventListener('mousemove', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left - (canvas.width / 2);
            const mouseY = e.clientY - rect.top - (canvas.height / 2);

            // Inverse Isometric Math
            const isoX = mouseX / (TILE_W / 2);
            const isoY = mouseY / (TILE_H / 2);
            
            mouseGridX = Math.round((isoY + isoX) / 2);
            mouseGridY = Math.round((isoY - isoX) / 2);
        });

        canvas.addEventListener('mousedown', () => attemptBuild());

        // --- Logic Methods ---
        function attemptBuild() {
            if (isGameOver) return;
            const key = `${mouseGridX},${mouseGridY}`;
            const bDef = BUILDINGS[selectedBuilding];

            // Distance check (Goblin reach)
            const dist = Math.abs(mouseGridX - Math.round(player.x)) + Math.abs(mouseGridY - Math.round(player.y));
            if (dist > 3) return;

            if (bDef.isFloor) {
                // Must not have a floor already, and must touch another floor
                if (gridData[key] && gridData[key].floorType) return;
                
                const touches = gridData[`${mouseGridX-1},${mouseGridY}`] || gridData[`${mouseGridX+1},${mouseGridY}`] || 
                                gridData[`${mouseGridX},${mouseGridY-1}`] || gridData[`${mouseGridX},${mouseGridY+1}`];
                if (!touches) return;

                if (scrap >= bDef.cost) {
                    scrap -= bDef.cost;
                    if (!gridData[key]) gridData[key] = { timer: 0 };
                    gridData[key].floorType = selectedBuilding;
                }
            } else {
                // Machines need a floor, but cannot overlap another machine
                if (!gridData[key] || !gridData[key].floorType) return; 
                if (gridData[key].machineType) return;

                if (scrap >= bDef.cost) {
                    scrap -= bDef.cost;
                    gridData[key].machineType = selectedBuilding;
                    recalculatePower();
                }
            }
        }

        function recalculatePower() {
            powerGen = 0; powerUse = 0;
            for (const key in gridData) {
                if (gridData[key].machineType) {
                    const mDef = BUILDINGS[gridData[key].machineType];
                    powerGen += mDef.pGen; powerUse += mDef.pCost;
                }
            }
        }

        function update(dt) {
            if (isGameOver) return;

            // 1. Smooth Goblin Movement
            let dx = 0, dy = 0;
            if (keys['KeyW'] || keys['ArrowUp']) { dx -= 1; dy -= 1; }
            if (keys['KeyS'] || keys['ArrowDown']) { dx += 1; dy += 1; }
            if (keys['KeyA'] || keys['ArrowLeft']) { dx -= 1; dy += 1; }
            if (keys['KeyD'] || keys['ArrowRight']) { dx += 1; dy -= 1; }

            // Normalize
            if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

            let nextX = player.x + dx * SPEED * dt;
            let nextY = player.y + dy * SPEED * dt;

            // Simple floor boundary check
            const currentTileKey = `${Math.round(nextX)},${Math.round(nextY)}`;
            if (gridData[currentTileKey] && gridData[currentTileKey].floorType) {
                player.x = nextX; player.y = nextY;
            }

            // 2. Dual-Axis Physics
            let torqueRoll = 0; // X axis imbalance
            let torquePitch = 0; // Y axis imbalance

            for (const key in gridData) {
                const [gx, gy] = key.split(',').map(Number);
                let tileMass = 0;
                if (gridData[key].floorType) tileMass += BUILDINGS[gridData[key].floorType].mass;
                if (gridData[key].machineType) tileMass += BUILDINGS[gridData[key].machineType].mass;
                
                // Roll is affected by X-Y diagonal, Pitch by X+Y depth
                torqueRoll += (gx - gy) * tileMass;
                torquePitch += (gx + gy) * tileMass;
            }
            torqueRoll += (player.x - player.y) * player.mass;
            torquePitch += (player.x + player.y) * player.mass;

            // Accelerate and apply dampening
            rollVel += (torqueRoll * GRAVITY_FACTOR * dt) / 100;
            pitchVel += (torquePitch * GRAVITY_FACTOR * dt) / 100;
            rollVel *= 0.96; pitchVel *= 0.96;
            roll += rollVel * dt; pitch += pitchVel * dt;

            // Check Capsizing
            if (Math.abs(roll) > MAX_ANGLE || Math.abs(pitch) > MAX_ANGLE) {
                isGameOver = true;
                document.getElementById('game-over').style.display = 'block';
            }

            // 3. Economy Ticks
            if (gridData["0,0"]) {
                gridData["0,0"].timer += dt;
                if (gridData["0,0"].timer > 1) { scrap += 1; gridData["0,0"].timer = 0; }
            }
            for (const key in gridData) {
                if (gridData[key].machineType === 'miner' && powerGen >= powerUse) {
                    gridData[key].timer += dt;
                    if (gridData[key].timer > 1.5) { scrap += 1; gridData[key].timer = 0; }
                }
            }

            // 4. Update Debris from below
            debrisParticles.forEach(p => {
                p.z += p.speed * dt;
                if (p.z > 100) { Object.assign(p, spawnDebris()); } // Reset below
            });

            // 5. Update UI
            document.getElementById('ui-scrap').innerText = `Scrap: ${Math.floor(scrap)}`;
            document.getElementById('ui-power').innerText = `Power: ${powerUse} / ${powerGen}`;
            
            const bDef = BUILDINGS[selectedBuilding];
            document.getElementById('ui-selected').innerText = `Blueprint: ${bDef.name} (Cost: ${bDef.cost})`;

            const pUi = document.getElementById('ui-pitch');
            pUi.innerText = `Pitch: ${Math.abs(pitch).toFixed(1)}° ${pitch > 0 ? 'Fwd' : (pitch < 0 ? 'Back' : '')}`;
            pUi.className = `ui-text ${Math.abs(pitch) > 30 ? 'danger' : (Math.abs(pitch) > 15 ? 'warning' : 'safe')}`;

            const rUi = document.getElementById('ui-roll');
            rUi.innerText = `Roll: ${Math.abs(roll).toFixed(1)}° ${roll > 0 ? 'Right' : (roll < 0 ? 'Left' : '')}`;
            rUi.className = `ui-text ${Math.abs(roll) > 30 ? 'danger' : (Math.abs(roll) > 15 ? 'warning' : 'safe')}`;
        }

        // --- Rendering Engine ---

        // Draws a 3D isometric block
        function drawBlock(cx, cy, height, topC, leftC, rightC) {
            // Top Face
            ctx.fillStyle = topC;
            ctx.beginPath();
            ctx.moveTo(cx, cy - height - TILE_H/2);
            ctx.lineTo(cx + TILE_W/2, cy - height);
            ctx.lineTo(cx, cy - height + TILE_H/2);
            ctx.lineTo(cx - TILE_W/2, cy - height);
            ctx.fill();
            // Left Face
            ctx.fillStyle = leftC;
            ctx.beginPath();
            ctx.moveTo(cx - TILE_W/2, cy - height);
            ctx.lineTo(cx, cy - height + TILE_H/2);
            ctx.lineTo(cx, cy + TILE_H/2);
            ctx.lineTo(cx - TILE_W/2, cy);
            ctx.fill();
            // Right Face
            ctx.fillStyle = rightC;
            ctx.beginPath();
            ctx.moveTo(cx, cy - height + TILE_H/2);
            ctx.lineTo(cx + TILE_W/2, cy - height);
            ctx.lineTo(cx + TILE_W/2, cy);
            ctx.lineTo(cx, cy + TILE_H/2);
            ctx.fill();
        }

        function draw(dt) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Debris (Perspective scale trick)
            ctx.fillStyle = 'rgba(200, 220, 255, 0.4)';
            debrisParticles.forEach(p => {
                if (p.z < 0) {
                    const scale = 500 / (500 - p.z); // Simple perspective projection
                    const sx = canvas.width/2 + (p.x * scale);
                    const sy = canvas.height/2 + (p.y * scale);
                    const sSize = p.size * scale;
                    ctx.fillRect(sx, sy, sSize, sSize);
                }
            });

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            
            // Apply camera wobble based on physics
            ctx.rotate(roll * Math.PI / 180 * 0.3); // Slight visual rotation
            ctx.translate(0, pitch * 1.5); // Slight visual shifting up/down

            // 2. Compile Render List for Painter's Algorithm
            const renderList = [];

            for (const key in gridData) {
                const [gx, gy] = key.split(',').map(Number);
                
                // Add Floor
                if (gridData[key].floorType) {
                    renderList.push({
                        gx: gx, gy: gy, type: 'floor',
                        def: BUILDINGS[gridData[key].floorType],
                        depth: gx + gy // Isometric depth sorting
                    });
                }
                // Add Machine (renders slightly higher depth so it draws on top of floor)
                if (gridData[key].machineType) {
                    renderList.push({
                        gx: gx, gy: gy, type: 'machine',
                        def: BUILDINGS[gridData[key].machineType],
                        hasPower: powerGen >= powerUse,
                        depth: gx + gy + 0.1 
                    });
                }
            }

            // Add Player
            renderList.push({
                gx: player.x, gy: player.y, type: 'player',
                def: player, depth: player.x + player.y + 0.05
            });

            // Sort Back-to-Front
            renderList.sort((a, b) => a.depth - b.depth);

            // 3. Render Objects
            renderList.forEach(obj => {
                // Convert Grid to Screen (Isometric Projection)
                const sx = (obj.gx - obj.gy) * (TILE_W / 2);
                const sy = (obj.gx + obj.gy) * (TILE_H / 2);

                if (obj.type === 'floor') {
                    drawBlock(sx, sy, obj.def.height, obj.def.top, obj.def.left, obj.def.right);
                } 
                else if (obj.type === 'machine') {
                    // Start drawing machine *above* the floor
                    const zOffset = 8; 
                    drawBlock(sx, sy - zOffset, obj.def.height, obj.def.top, obj.def.left, obj.def.right);
                    
                    // Power Warning
                    if (obj.def.name === 'Auto-Miner' && !obj.hasPower) {
                        ctx.fillStyle = 'red';
                        ctx.beginPath(); ctx.arc(sx, sy - zOffset - obj.def.height, 5, 0, Math.PI*2); ctx.fill();
                    }
                } 
                else if (obj.type === 'player') {
                    const zOffset = 8;
                    drawBlock(sx, sy - zOffset, 16, obj.def.colorTop, obj.def.colorLeft, obj.def.colorRight);
                }
            });

            // 4. Draw Blueprint Ghost (if valid)
            if (!isGameOver) {
                const pDist = Math.abs(mouseGridX - Math.round(player.x)) + Math.abs(mouseGridY - Math.round(player.y));
                const bDef = BUILDINGS[selectedBuilding];
                
                let isValid = false;
                if (pDist <= 3 && scrap >= bDef.cost) {
                    const key = `${mouseGridX},${mouseGridY}`;
                    if (bDef.isFloor) {
                        const touches = gridData[`${mouseGridX-1},${mouseGridY}`] || gridData[`${mouseGridX+1},${mouseGridY}`] || 
                                        gridData[`${mouseGridX},${mouseGridY-1}`] || gridData[`${mouseGridX},${mouseGridY+1}`];
                        isValid = touches && (!gridData[key] || !gridData[key].floorType);
                    } else {
                        isValid = gridData[key] && gridData[key].floorType && !gridData[key].machineType;
                    }
                }

                if (isValid) {
                    const sx = (mouseGridX - mouseGridY) * (TILE_W / 2);
                    const sy = (mouseGridX + mouseGridY) * (TILE_H / 2);
                    const zOff = bDef.isFloor ? 0 : 8;
                    
                    ctx.globalAlpha = 0.5;
                    drawBlock(sx, sy - zOff, bDef.height, '#00FF00', '#00AA00', '#005500');
                    ctx.globalAlpha = 1.0;
                }
            }

            ctx.restore();
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(dt);
            draw(dt);
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
