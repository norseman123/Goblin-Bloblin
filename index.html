<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin Factory - Freefall Balancing Act</title>
    <style>
        body { 
            margin: 0; background-color: #111; display: flex; 
            justify-content: center; align-items: center; 
            height: 100vh; color: white; font-family: monospace; 
            overflow: hidden;
        }
        #game-container { position: relative; }
        canvas { 
            background-color: #5b90a6; 
            border: 4px solid #444; 
            box-shadow: 0px 0px 30px rgba(0,0,0,0.8);
            display: block;
        }
        #ui-layer {
            position: absolute; top: 10px; left: 10px;
            pointer-events: none; background: rgba(0, 0, 0, 0.8);
            padding: 15px; border-radius: 5px; border: 1px solid #777;
            text-shadow: 1px 1px 2px black;
        }
        #game-over {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(200, 0, 0, 0.9); padding: 40px;
            border: 4px solid white; text-align: center;
            display: none; font-size: 24px; font-weight: bold;
        }
        .ui-text { margin: 5px 0; font-size: 16px; }
        .controls { color: #aaa; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div class="ui-text" id="ui-scrap" style="color: #FFD700; font-weight: bold;">Scrap: 50</div>
            <div class="ui-text" id="ui-power" style="color: #00FFFF;">Power: 0 / 0</div>
            <div class="ui-text" id="ui-angle" style="color: #FF6347;">Tilt: 0°</div>
            <hr style="border-color: #444;">
            <div class="ui-text" id="ui-selected">Selected: Pearl Wood Floor</div>
            <div class="controls">
                1: Wood Floor | 2: Scrap Floor | 3: Steel Floor<br>
                4: Auto-Miner | 5: Furnace
            </div>
        </div>
        
        <div id="game-over">
            PLATFORM FLIPPED!<br><br>
            <span style="font-size: 16px;">Refresh to try again.</span>
        </div>

        <canvas id="gameCanvas" width="900" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- Core Engine & Physics Settings ---
        const TILE_SIZE = 50;
        const SPEED = 300; 
        const GRAVITY_FACTOR = 0.5; // How harshly off-balance weight affects tilt
        const MAX_ANGLE = Math.PI / 4; // 45 degrees

        let lastTime = 0;
        const keys = {};
        let isGameOver = false;
        
        // Physics State
        let platformAngle = 0;
        let angularVelocity = 0;

        // --- Economy & Map ---
        let scrap = 60;
        let powerGenerated = 0;
        let powerConsumed = 0;
        const gridData = {}; 

        let mouseGridX = 0;
        let mouseGridY = 0;
        let selectedBuilding = 'floor_wood';

        // --- Entities ---
        const player = { x: 0, y: -TILE_SIZE, width: 32, height: 32, color: '#32CD32', mass: 15 };

        // Wind particles for falling effect
        const windParticles = Array.from({length: 50}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            speed: 500 + Math.random() * 500,
            length: 20 + Math.random() * 50
        }));

        // --- Database ---
        const BUILDINGS = {
            'core': { name: 'Core Stone', color: '#8A2BE2', mass: 100, isFloor: true, cost: 0, powerCost: 0, powerGen: 0 },
            
            // Floors (y = 0)
            'floor_wood': { name: 'Pearl Wood Floor', color: '#DEB887', mass: 2, isFloor: true, cost: 5, powerCost: 0, powerGen: 0 },
            'floor_scrap': { name: 'Scrap Iron Floor', color: '#708090', mass: 10, isFloor: true, cost: 15, powerCost: 0, powerGen: 0 },
            'floor_steel': { name: 'Dark Steel Floor', color: '#2F4F4F', mass: 40, isFloor: true, cost: 40, powerCost: 0, powerGen: 0 },
            
            // Machines (y = -1)
            'miner': { name: 'Auto-Miner', color: '#4682B4', mass: 8, isFloor: false, cost: 25, powerCost: 1, powerGen: 0 },
            'furnace': { name: 'Furnace', color: '#8B0000', mass: 12, isFloor: false, cost: 15, powerCost: 0, powerGen: 5 }
        };

        // Initialize Center Core
        gridData["0,0"] = { type: 'core', timer: 0 };

        // --- Inputs ---
        window.addEventListener('keydown', e => {
            if (isGameOver) return;
            keys[e.code] = true;
            if (e.code === 'Digit1') selectedBuilding = 'floor_wood';
            if (e.code === 'Digit2') selectedBuilding = 'floor_scrap';
            if (e.code === 'Digit3') selectedBuilding = 'floor_steel';
            if (e.code === 'Digit4') selectedBuilding = 'miner';
            if (e.code === 'Digit5') selectedBuilding = 'furnace';
            if (e.code === 'Space') attemptBuild();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Inverse kinematics for mouse aiming on a rotating platform
        canvas.addEventListener('mousemove', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Shift coordinate system to canvas center
            const dx = mouseX - canvas.width / 2;
            const dy = mouseY - canvas.height / 2;

            // Rotate coordinates backwards to find the grid position
            const cos = Math.cos(-platformAngle);
            const sin = Math.sin(-platformAngle);
            const localX = dx * cos - dy * sin;
            const localY = dx * sin + dy * cos;

            // Snap to grid
            mouseGridX = Math.floor(localX / TILE_SIZE);
            mouseGridY = Math.floor(localY / TILE_SIZE);
        });

        canvas.addEventListener('mousedown', () => attemptBuild());

        // --- Logic Methods ---
        function attemptBuild() {
            if (isGameOver) return;
            const key = `${mouseGridX},${mouseGridY}`;
            const bDef = BUILDINGS[selectedBuilding];

            // 1. Spot must be empty
            if (gridData[key]) return;

            // 2. Distance check
            const playerGridX = Math.floor((player.x + player.width/2) / TILE_SIZE);
            const playerGridY = Math.floor((player.y + player.height/2) / TILE_SIZE);
            if (Math.abs(mouseGridX - playerGridX) + Math.abs(mouseGridY - playerGridY) > 2) return;

            // 3. Placement Rules
            if (bDef.isFloor) {
                // Floors must be placed at y=0 and adjacent to another floor
                if (mouseGridY !== 0) return;
                if (!gridData[`${mouseGridX - 1},0`] && !gridData[`${mouseGridX + 1},0`]) return; 
            } else {
                // Machines must be placed at y=-1, directly ON TOP of a floor
                if (mouseGridY !== -1) return;
                if (!gridData[`${mouseGridX},0`]) return; // Needs a floor beneath it
            }

            // 4. Affordability
            if (scrap >= bDef.cost) {
                scrap -= bDef.cost;
                gridData[key] = { type: selectedBuilding, timer: 0 };
                recalculatePower();
            }
        }

        function recalculatePower() {
            powerGenerated = 0; powerConsumed = 0;
            for (const key in gridData) {
                const bType = gridData[key].type;
                powerGenerated += BUILDINGS[bType].powerGen;
                powerConsumed += BUILDINGS[bType].powerCost;
            }
        }

        function calculatePhysics(dt) {
            let totalTorque = 0;
            
            // 1. Calculate torque from buildings
            for (const key in gridData) {
                const [gx, gy] = key.split(',').map(Number);
                const bType = gridData[key].type;
                const mass = BUILDINGS[bType].mass;
                // Center of the tile
                const centerDistX = (gx * TILE_SIZE) + (TILE_SIZE / 2);
                totalTorque += centerDistX * mass;
            }

            // 2. Calculate torque from goblin
            const goblinCenterX = player.x + (player.width / 2);
            totalTorque += goblinCenterX * player.mass;

            // Apply gravity factor to the torque
            const angularAcceleration = (totalTorque * GRAVITY_FACTOR) / 100000; 

            // Update rotation
            angularVelocity += angularAcceleration;
            angularVelocity *= 0.95; // Air friction damping
            platformAngle += angularVelocity * dt;

            // Game Over Check
            if (Math.abs(platformAngle) > MAX_ANGLE) {
                isGameOver = true;
                document.getElementById('game-over').style.display = 'block';
            }
        }

        function update(dt) {
            if (isGameOver) return;

            // 1. Goblin Movement (Local to platform)
            let dx = 0;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
            player.x += dx * SPEED * dt;

            // 2. Platform boundary limits (Don't let goblin walk into the void)
            // Find leftmost and rightmost floors
            let minX = 0, maxX = 0;
            for (const key in gridData) {
                const [gx, gy] = key.split(',').map(Number);
                if (gy === 0) {
                    if (gx < minX) minX = gx;
                    if (gx > maxX) maxX = gx;
                }
            }
            const leftBound = minX * TILE_SIZE;
            const rightBound = (maxX * TILE_SIZE) + TILE_SIZE - player.width;
            player.x = Math.max(leftBound, Math.min(rightBound, player.x));

            // 3. Physics Physics Physics
            calculatePhysics(dt);

            // 4. Update Machines & Passive Core
            // Core stone generates 1 scrap/sec so you don't softlock
            gridData["0,0"].timer += dt;
            if (gridData["0,0"].timer >= 1.0) { scrap += 1; gridData["0,0"].timer = 0; }

            for (const key in gridData) {
                const bData = gridData[key];
                if (bData.type === 'miner' && powerGenerated >= powerConsumed) {
                    bData.timer += dt;
                    if (bData.timer >= 1.5) { scrap += 1; bData.timer = 0; }
                }
            }

            // 5. Update Wind Particles (Falling Illusion)
            windParticles.forEach(p => {
                p.y -= p.speed * dt;
                if (p.y < -50) { p.y = canvas.height + 50; p.x = Math.random() * canvas.width; }
            });

            // 6. Update UI
            document.getElementById('ui-scrap').innerText = `Scrap: ${Math.floor(scrap)}`;
            document.getElementById('ui-power').innerText = `Power: ${powerConsumed} / ${powerGenerated}`;
            document.getElementById('ui-selected').innerText = `Selected: ${BUILDINGS[selectedBuilding].name} (Cost: ${BUILDINGS[selectedBuilding].cost} | Wgt: ${BUILDINGS[selectedBuilding].mass})`;
            
            // Convert radians to degrees for display
            const degrees = (platformAngle * (180 / Math.PI)).toFixed(1);
            document.getElementById('ui-angle').innerText = `Tilt: ${Math.abs(degrees)}° ${degrees > 0 ? 'Right' : (degrees < 0 ? 'Left' : '')}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background Wind
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            windParticles.forEach(p => {
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + p.length); ctx.stroke();
            });

            // --- CAMERA SETUP FOR ROTATION ---
            ctx.save();
            // Move camera origin to the center of the screen
            ctx.translate(canvas.width / 2, canvas.height / 2);
            // Rotate everything by our physics angle
            ctx.rotate(platformAngle);

            // 2. Draw Platform & Buildings
            for (const key in gridData) {
                const [gx, gy] = key.split(',').map(Number);
                const bType = gridData[key].type;
                
                ctx.fillStyle = BUILDINGS[bType].color; 
                ctx.fillRect(gx * TILE_SIZE, gy * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = '#222';
                ctx.strokeRect(gx * TILE_SIZE, gy * TILE_SIZE, TILE_SIZE, TILE_SIZE);

                // No Power Indicator for miners
                if (bType === 'miner' && powerGenerated < powerConsumed) {
                    ctx.fillStyle = 'red';
                    ctx.fillRect(gx * TILE_SIZE + 15, gy * TILE_SIZE + 15, 20, 20);
                }
            }

            // 3. Draw Goblin Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // 4. Draw Blueprint Ghost (if not Game Over)
            if (!isGameOver) {
                const bDef = BUILDINGS[selectedBuilding];
                
                // Validate placement visually
                let isValid = false;
                const pGridX = Math.floor((player.x + player.width/2) / TILE_SIZE);
                const pGridY = Math.floor((player.y + player.height/2) / TILE_SIZE);
                
                if (!gridData[`${mouseGridX},${mouseGridY}`] && 
                    Math.abs(mouseGridX - pGridX) + Math.abs(mouseGridY - pGridY) <= 2 &&
                    scrap >= bDef.cost) {
                    
                    if (bDef.isFloor && mouseGridY === 0 && (gridData[`${mouseGridX-1},0`] || gridData[`${mouseGridX+1},0`])) {
                        isValid = true;
                    } else if (!bDef.isFloor && mouseGridY === -1 && gridData[`${mouseGridX},0`]) {
                        isValid = true;
                    }
                }

                ctx.fillStyle = isValid ? 'rgba(0, 255, 0, 0.4)' : 'rgba(255, 0, 0, 0.4)';
                ctx.fillRect(mouseGridX * TILE_SIZE, mouseGridY * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }

            ctx.restore(); // Revert rotation logic so UI isn't spun around
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
