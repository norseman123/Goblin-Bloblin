<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slope-Slider Foundry</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-family: monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #2a2a2a;
            border: 4px solid #555;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            cursor: crosshair;
            margin-top: 10px;
        }
        #dashboard {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .stat { font-weight: bold; color: #ffcc00; }
        .controls { margin-top: 10px; }
        button {
            background-color: #444;
            color: white;
            border: 2px solid #666;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            margin: 0 5px;
        }
        button.active { background-color: #7a8b29; border-color: #a4b93d; }
        button:hover { background-color: #555; }
    </style>
</head>
<body>

    <h2>GOBLIN DESCENT</h2>
    <div id="dashboard">
        Depth: <span id="depthDisplay" class="stat">0</span>m | 
        Fortitude: <span id="fortitudeDisplay" class="stat">100</span> | 
        Scrap: <span id="scrapDisplay" class="stat">50</span>
    </div>

    <div class="controls">
        <button id="btn-armor" class="active" onclick="selectTool('armor')">Build Armor (10 Scrap)</button>
        <button id="btn-drill" onclick="selectTool('drill')">Build Drill (25 Scrap)</button>
    </div>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        let depth = 0;
        let fortitude = 100;
        let scrap = 50;
        let gameOver = false;
        let gameWon = false;
        let frameCount = 0;
        let currentTool = 'armor'; // 'armor' or 'drill'

        // Platform Grid (5 columns, 2 rows at the bottom)
        const cols = 5;
        const rows = 2;
        const cellSize = 80;
        const platformY = canvas.height - (rows * cellSize);
        let platform = [];

        for (let r = 0; r < rows; r++) {
            platform[r] = [];
            for (let c = 0; c < cols; c++) {
                platform[r][c] = { type: 'empty', health: 0 };
            }
        }

        // Obstacles (Falling Rocks)
        let obstacles = [];

        // UI Updates
        function updateUI() {
            document.getElementById('depthDisplay').innerText = Math.floor(depth);
            document.getElementById('fortitudeDisplay').innerText = fortitude;
            document.getElementById('scrapDisplay').innerText = Math.floor(scrap);
        }

        // Tool Selection
        window.selectTool = function(tool) {
            currentTool = tool;
            document.getElementById('btn-armor').classList.remove('active');
            document.getElementById('btn-drill').classList.remove('active');
            document.getElementById('btn-' + tool).classList.add('active');
        }

        // Mouse Click Handler for Building
        canvas.addEventListener('mousedown', function(e) {
            if (gameOver || gameWon) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check if click is within platform area
            if (mouseY > platformY) {
                const c = Math.floor(mouseX / cellSize);
                const r = Math.floor((mouseY - platformY) / cellSize);

                if (platform[r][c].type === 'empty') {
                    if (currentTool === 'armor' && scrap >= 10) {
                        scrap -= 10;
                        platform[r][c] = { type: 'armor', health: 3 };
                    } else if (currentTool === 'drill' && scrap >= 25) {
                        scrap -= 25;
                        platform[r][c] = { type: 'drill', health: 1 };
                    }
                    updateUI();
                }
            }
        });

        // Main Game Loop
        function gameLoop() {
            if (gameOver || gameWon) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            // 1. Update Game Stats
            depth += 0.05; // Descend deeper
            if (depth >= 1000) gameWon = true;

            // 2. Process Drills (Generate Scrap)
            if (frameCount % 60 === 0) { // Every ~1 second
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (platform[r][c].type === 'drill') {
                            scrap += 2; // Drills make 2 scrap per second
                        }
                    }
                }
                updateUI();
            }

            // 3. Spawn Obstacles
            if (Math.random() < 0.02 + (depth / 20000)) { // Gets harder as you go deeper
                const randomCol = Math.floor(Math.random() * cols);
                obstacles.push({
                    x: randomCol * cellSize + (cellSize/2),
                    y: -20,
                    radius: 15,
                    col: randomCol
                });
            }

            // 4. Update and Draw Obstacles
            ctx.fillStyle = '#ff4444';
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += 3 + (depth / 200); // Speed increases with depth

                // Collision with platform
                if (obs.y > platformY) {
                    const hitRow = obs.y > platformY + cellSize ? 1 : 0;
                    const cell = platform[hitRow][obs.col];

                    if (cell.type !== 'empty') {
                        cell.health--;
                        if (cell.health <= 0) cell.type = 'empty';
                    } else {
                        // Hits the bare platform, take damage
                        fortitude -= 5;
                        if (fortitude <= 0) {
                            fortitude = 0;
                            gameOver = true;
                        }
                    }
                    obstacles.splice(i, 1);
                    updateUI();
                    continue;
                }

                // Draw Obstacle
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 5. Draw Platform Grid
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * cellSize;
                    const y = platformY + (r * cellSize);
                    
                    ctx.strokeStyle = '#444';
                    ctx.strokeRect(x, y, cellSize, cellSize);

                    const cell = platform[r][c];
                    if (cell.type === 'armor') {
                        ctx.fillStyle = '#7a8b29';
                        ctx.fillRect(x + 5, y + 5, cellSize - 10, cellSize - 10);
                        ctx.fillStyle = '#fff';
                        ctx.fillText('HP:' + cell.health, x + 25, y + 45);
                    } else if (cell.type === 'drill') {
                        ctx.fillStyle = '#4da6ff';
                        ctx.fillRect(x + 5, y + 5, cellSize - 10, cellSize - 10);
                        ctx.fillStyle = '#fff';
                        ctx.fillText('DRILL', x + 20, y + 45);
                    }
                }
            }

            // Draw End States
            if (gameOver) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '30px monospace';
                ctx.fillText('PLATFORM DESTROYED', 40, canvas.height / 2);
            } else if (gameWon) {
                ctx.fillStyle = 'rgba(0, 255, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '30px monospace';
                ctx.fillText('CRASH SURVIVED!', 60, canvas.height / 2);
            }

            requestAnimationFrame(gameLoop);
        }

        // Start Game
        updateUI();
        gameLoop();
    </script>
</body>
</html>
